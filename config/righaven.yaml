agents_api:
  enabled: true
config_version: 6
models:
- name: rh-codex
  display_name: RigHaven Harness
  use: righaven.codex_provider:HarnessCodexChatModel
  model: gpt-6.1-sol
  supports_thinking: true
  supports_reasoning_effort: true
  request_timeout: 1800
tool_groups:
- name: file:read
- name: harness
tools:
- name: ls
  group: file:read
  use: righaven_core.sandbox.tools:ls_tool
- name: read_file
  group: file:read
  use: righaven_core.sandbox.tools:read_file_tool
- name: glob
  group: file:read
  use: righaven_core.sandbox.tools:glob_tool
- name: grep
  group: file:read
  use: righaven_core.sandbox.tools:grep_tool
- name: harness_delegate_batch
  group: harness
  use: righaven.tools:harness_delegate_batch
- name: harness_delegate
  group: harness
  use: righaven.tools:harness_delegate
- name: harness_read_context
  group: harness
  use: righaven.tools:harness_read_context
- name: harness_plan
  group: harness
  use: righaven.tools:harness_plan
- name: harness_lessons
  group: harness
  use: righaven.tools:harness_lessons
- name: harness_skills
  group: harness
  use: righaven.tools:harness_skills
sandbox:
  use: righaven_core.sandbox.local:LocalSandboxProvider
  allow_host_bash: false
skills:
  path: /app/skill-catalog
  container_path: /mnt/skills
subagents:
  max_total_per_run: 40
  custom_agents:
    photocraft:
      description: 'Immagini e ritocco: Ritocco, compositing raster e texture con
        livelli e maschere. Usa photocraft-cli.'
      system_prompt: This is the photocraft tool integration, not a fixed professional
        role. Use harness_delegate with agent="photocraft" and include inputs, paths,
        editable sources, opening application and observable acceptance checks. Inherit
        the executing team model; do not run CLIs in the Gateway. Report real results
        and limitations. Project roles are assigned dynamically.
      skills:
      - skill-workspace
      - skill-photocraft
      model: inherit
      max_turns: 50
      timeout_seconds: 1800
      disallowed_tools:
      - task
      - ask_clarification
      - present_files
    vectorcraft:
