[project]
name = "righaven-extension-api"
version = "0.2.6"
description = "Public contracts for RigHaven extensions"
requires-python = ">=3.12"
# Keep the contract package import-light and independent from the host. Public
# values are stdlib-based; concrete middleware types are validated by RigHaven.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["righaven_extension_api"]
